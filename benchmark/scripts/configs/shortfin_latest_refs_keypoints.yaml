# Key local Shortfin points for the latest-ref implementation.

output:
  csv_dir: csv_plots
  plot_dir: plots
  checkpoint_dir: .checkpoints

outlier_rejection:
  method: none

groups:
  n4_60k:
    protocols: [shortfin]
    rates: [60000]
    faults: [0]
    bench:
      nodes: 4
      duration: 30
      runs: 1
    node:
      dag_protocol: shortfin
  n8_sweep:
    protocols: [shortfin]
    rates: [30000, 60000, 90000]
    faults: [0]
    bench:
      nodes: 8
      duration: 30
      runs: 1
    node:
      dag_protocol: shortfin
