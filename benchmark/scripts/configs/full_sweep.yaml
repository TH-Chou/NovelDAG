# Full DAG protocol comparison sweep.
# Usage: python run_bench.py --mode local run --config configs/full_sweep.yaml --group d=0

bench_defaults:
  nodes: 10
  workers: 1
  tx_size: 512
  duration: 20
  runs: 3

node_defaults:
  header_size: 1000
  max_header_delay: 170
  gc_depth: 50
  sync_retry_delay: 10000
  sync_retry_nodes: 3
  batch_size: 500000
  max_batch_delay: 200
  consensus_protocol: round_robin

local_defaults:
  delays: [0]

output:
  csv_dir: csv_plots
  plot_dir: plots
  checkpoint_dir: .checkpoints

outlier_rejection:
  method: middle-N
  middle_n: 3
  std_dev_threshold: 2.0

groups:
  # ── Single-delay groups (run individually with --group) ──
  d0:
    protocols: [narwhal, noveldag, wahoo]
    rates: [60000, 130000, 200000, 270000, 340000]
    faults: [0, 1, 3]
    local:
      delays: [0]

  d100:
    protocols: [narwhal, noveldag, wahoo]
    rates: [60000, 130000, 200000, 270000]
    faults: [0, 1, 3]
    local:
      delays: [100]

  # ── Full RTT sweep ──
  rtt_sweep:
    protocols: [narwhal, noveldag, wahoo]
    rates: [60000, 130000, 200000, 270000]
    faults: [0, 1, 3]
    local:
      delays: [0, 100]

  # ── Quick smoke for all protocols ──
  all_smoke:
    protocols: [narwhal, noveldag, wahoo]
    rates: [60000, 130000]
    faults: [0]
    bench:
      duration: 15
      runs: 2