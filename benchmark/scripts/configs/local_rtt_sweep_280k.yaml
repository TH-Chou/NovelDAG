# Local RTT latency sweep for the paper/debug workflow.
#
# dummynet's delay value is one-way. The values below therefore correspond to
# RTT = 0, 100, 200, 300, 400 ms.

bench_defaults:
  nodes: 10
  workers: 1
  tx_size: 512
  duration: 30
  runs: 1

node_defaults:
  header_size: 1000
  max_header_delay: 1000
  gc_depth: 50
  sync_retry_delay: 10000
  sync_retry_nodes: 3
  batch_size: 500000
  max_batch_delay: 200
  consensus_protocol: round_robin

output:
  csv_dir: csv_plots
  plot_dir: plots/local_rtt_sweep_280k
  checkpoint_dir: .checkpoints

outlier_rejection:
  method: none

groups:
  local_rtt_280k:
    protocols: [narwhal, noveldag, wahoo]
    rates: [280000]
    faults: [0, 1, 3]
    local:
      delays: [0, 50, 100, 150, 200]
